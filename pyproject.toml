[project]
name = "mds7202-labs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "ipykernel>=6.0.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "kaleido>=0.2.1",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.2.5",
    "lightgbm>=4.6.0",
    "matplotlib>=3.7.0",
    "missingno>=0.5.2",
    "mlflow>=3.13.0",
    "nltk>=3.9.4",
    "numpy>=1.24.0",
    "openpyxl>=3.1.5",
    "optuna>=4.9.0",
    "optuna-integration[xgboost]>=4.9.0",
    "pandas>=2.3.3",
    "pillow>=10.0.0",
    "plotly>=5.18.0",
    "pre-commit>=3.0.0",
    "pypdf>=6.14.2",
    "pypdf2>=3.0.1",
    "ruff>=0.1.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "shap>=0.52.0",
    "umap-learn>=0.5.12",
    "uvicorn>=0.49.0",
    "xgboost>=3.2.0",
    "faiss-cpu>=1.14.3",
    "python-dotenv>=1.2.2",
    "cloudpickle>=3.1.2",
    "gradio>=6.20.0",
]
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors: errores de estilo (indentación, espacios, etc.)
    "W",   # pycodestyle warnings: advertencias de estilo menores
    "F",   # pyflakes: imports no usados, variables indefinidas, nombres duplicados
    "I",   # isort: orden y agrupación correcta de imports
    "B",   # flake8-bugbear: patrones propensos a bugs y malas prácticas
    "UP",  # pyupgrade: modernización automática de sintaxis a Python 3.12+
]
ignore = [
    "E501", # line-too-long: largo de línea (delegado a ruff-format)
    "B008"
]

[tool.uv.workspace]
exclude = [
    "proyecto/Parte3/backend",
    "proyecto/Parte3/frontend",
]
